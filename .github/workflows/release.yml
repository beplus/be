name: Release

# A merge into main that bumped the version publishes it to public npm, tags it with a GitHub
# Release, and mirrors it to GitHub Packages, as every @beplus/* repository does; any other merge
# finds nothing to do. Every step checks what is already done, so re-running a failed run is safe.
# See docs/releasing.md.
#
# npm trusts this file by name (Trusted Publisher: beplus/be, release.yml, environment npm), so
# there is no npm token anywhere: the publish job authenticates with its OIDC token. GitHub Packages
# takes the workflow's own GITHUB_TOKEN.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  plan:
    name: Plan
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # is the version in GitHub Packages yet
    outputs:
      version: ${{ steps.verify.outputs.version }}
      tag: ${{ steps.verify.outputs.tag }}
      dist_tag: ${{ steps.verify.outputs.dist_tag }}
      source_sha: ${{ steps.verify.outputs.source_sha }}
      need_publish: ${{ steps.verify.outputs.need_publish }}
      need_release: ${{ steps.verify.outputs.need_release }}
      need_github_packages: ${{ steps.verify.outputs.need_github_packages }}
    steps:
      - uses: actions/checkout@v7
      - id: verify
        run: scripts/release/verify-version.sh release
        env:
          GITHUB_PACKAGES_TOKEN: ${{ github.token }}

  publish:
    name: Publish ${{ needs.plan.outputs.tag }}
    needs: plan
    if: needs.plan.outputs.need_publish == 'true' || needs.plan.outputs.need_release == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # tag + GitHub Release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Make sure npm can publish with OIDC (>= 11.5.1)
        run: |
          if ! node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1);
          ' "$(npm --version)"; then
            npm install --global npm@11
          fi
          npm --version

      - name: Publish to npm
        if: needs.plan.outputs.need_publish == 'true'
        run: npm publish --provenance --tag "${DIST_TAG}"
        env:
          DIST_TAG: ${{ needs.plan.outputs.dist_tag }}

      - name: Tag and create the GitHub Release
        if: needs.plan.outputs.need_release == 'true'
        run: |
          scripts/release/changelog-notes.sh "${TAG}" > "${RUNNER_TEMP}/notes.md"
          if [[ "${DIST_TAG}" == "latest" ]]; then
            channel=(--latest)
          else
            channel=(--prerelease --latest=false)
          fi
          gh release create "${TAG}" --target "${GITHUB_SHA}" --title "${TAG}" \
            --notes-file "${RUNNER_TEMP}/notes.md" "${channel[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          DIST_TAG: ${{ needs.plan.outputs.dist_tag }}

      - name: Summary
        run: |
          {
            echo "### Released ${TAG}"
            echo
            echo "- npm: https://www.npmjs.com/package/@beplus/be/v/${VERSION}"
            echo "- GitHub: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          } >> "${GITHUB_STEP_SUMMARY}"
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}

  github-packages:
    name: GitHub Packages ${{ needs.plan.outputs.tag }}
    needs: [plan, publish]
    # After npm, so the mirror never has a version npm refused; also when there was nothing left to
    # do on npm (publish skipped), which is how a version missing only here gets published.
    if: >-
      always() && needs.plan.result == 'success'
      && needs.plan.outputs.need_github_packages == 'true'
      && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The commit the version was cut from, which is its tag once it has one: a later merge that
      # bumps nothing still publishes exactly what npm has.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # publishConfig pins the @beplus scope to npmjs, and only command-line flags outrank it, so
      # the .npmrc carries just the token, read from the environment rather than written to disk.
      - name: Publish to GitHub Packages
        run: |
          echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > "${RUNNER_TEMP}/.npmrc-github"
          npm publish --userconfig "${RUNNER_TEMP}/.npmrc-github" \
            --registry=https://npm.pkg.github.com/ --@beplus:registry=https://npm.pkg.github.com/ \
            --tag "${DIST_TAG}"
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          DIST_TAG: ${{ needs.plan.outputs.dist_tag }}

      - name: Summary
        run: |
          {
            echo "### Mirrored ${TAG} to GitHub Packages"
            echo
            echo "- ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pkgs/npm/be"
          } >> "${GITHUB_STEP_SUMMARY}"
        env:
          TAG: ${{ needs.plan.outputs.tag }}
