name: CI

# Pull requests run it directly; the Release workflow calls it on every push to dev, stage, prod
# and main, so the merge result is tested again before anything is published or promoted.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  gate:
    # The PR gate (setup-beplus pr-gate/PR-GATE.md): never a draft, and in a stack only the top PR,
    # whose tree holds every PR below it. Every job below waits for its answer; any other event runs.
    name: PR gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      root: ${{ steps.gate.outputs.root }}
    steps:
      - id: gate
        uses: beplus/setup-beplus/pr-gate@v2
        with:
          stack: top-only

  test:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS is what the maintainers run, with its bash 3.2.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run test:host

  lint:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npm run lint

  version:
    needs: gate
    # Only a PR into dev cuts a release (stage and prod are fast-forwarded from it), so only there
    # do the release rules apply. A stack's top PR is into the PR below it: its root is dev.
    if: needs.gate.outputs.run == 'true' && (github.event_name == 'pull_request' && (needs.gate.outputs.root || github.base_ref) == 'dev')
    name: Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: scripts/release/verify-version.sh pr "origin/${BASE_REF}" "${HEAD_REF}"
        env:
          BASE_REF: ${{ (needs.gate.outputs.root || github.base_ref) }}
          HEAD_REF: ${{ github.head_ref }}
